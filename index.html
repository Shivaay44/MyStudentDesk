          "name": "How does the 75% attendance bunk calculator work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The calculator evaluates your total and attended lectures using the formula: Required Classes = ceil((0.75 * Total - Attended) / 0.25) if below 75%, or Safe Bunks = floor((Attended - 0.75 * Total) / 0.75) if above 75%."

        },

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For CBSE Class 10 & 12, 1 Language subject is mandatory along with your 4 highest-scoring academic or vocational subjects out of the remaining subjects."
          }
        },
        {
          "@type": "Question",
          "name": "How do I convert CGPA to Percentage for Indian Universities?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For CBSE and most central universities, Percentage = CGPA * 9.5. For Mumbai University: Percentage = 7.1 * CGPA + 11 (if CGPA >= 7) or 7.25 * CGPA + 11 (if CGPA < 7). For VTU: (CGPA - 0.75) * 10."
          }
        },
